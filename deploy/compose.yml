name: rishav-lab4
x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: rishav-lab4-app:local
  volumes:
    - ${LAB4_HOST_ROOT:-..}/.runtime/app-api-key:/run/secrets/app-api-key:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
    interval: 1s
    timeout: 2s
    retries: 20
services:
  blue:
    <<: *app
    container_name: rishav-lab4-blue
    environment:
      APP_ENV: blue
      APP_VERSION: ${BLUE_VERSION:-1.0.0}
  green:
    <<: *app
    container_name: rishav-lab4-green
    environment:
      APP_ENV: green
      APP_VERSION: ${GREEN_VERSION:-2.0.0}
      FAIL_HEALTH: ${FAIL_HEALTH:-false}
      FAIL_WORK: ${FAIL_WORK:-false}
  gateway:
    image: nginx:alpine
    container_name: rishav-lab4-gateway
    command: ["nginx", "-c", "/etc/nginx/lab4-source/nginx.conf", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:5040:8080"
    volumes:
      - ${LAB4_HOST_ROOT:-..}/deploy:/etc/nginx/lab4-source:ro
      - ${LAB4_HOST_ROOT:-..}/.runtime/gateway:/etc/nginx/lab4:ro
    depends_on:
      blue:
        condition: service_healthy
      green:
        condition: service_healthy
  redis-primary:
    image: redis:7-alpine
    container_name: rishav-lab4-primary
    command: ["redis-server", "--appendonly", "yes", "--repl-diskless-sync-delay", "0"]
    volumes:
      - primary-data:/data
  redis-standby:
    image: redis:7-alpine
    container_name: rishav-lab4-standby
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--appendonly", "yes"]
    volumes:
      - standby-data:/data
  vault:
    image: hashicorp/vault:1.21
    container_name: rishav-lab4-vault
    command: server
    ports:
      - "127.0.0.1:8240:8200"
    volumes:
      - ${LAB4_HOST_ROOT:-..}/vault/config:/vault/config:ro
      - vault-data:/vault/data
volumes:
  primary-data:
  standby-data:
  vault-data:
