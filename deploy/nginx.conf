worker_processes 1;
worker_shutdown_timeout 5s;
events { worker_connections 1024; }
http {
  access_log off;
  upstream application { include /etc/nginx/lab4/upstreams.conf; }
  upstream blue_pool { server blue:8080; }
  upstream green_pool { server green:8080; }
  include /etc/nginx/lab4/routing.conf;
  server {
    listen 8080;
    location / {
      proxy_pass http://$lab4_backend;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
      proxy_next_upstream off;
    }
  }
}
