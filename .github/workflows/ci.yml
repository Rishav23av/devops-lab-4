name: Lab 4 gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_unit -v
  integration-and-promotion:
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare this run's evidence
        run: rm -f docs/commands/pipeline-*.json docs/commands/pipeline-*-unit.txt docs/commands/pipeline-*-integration.txt
      - run: python -m scripts.setup
      - run: python -m scripts.pipeline
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redacted-gate-results
          path: docs/commands/pipeline-*.json
          if-no-files-found: ignore
      - if: always()
        run: docker compose -f deploy/compose.yml down -v
